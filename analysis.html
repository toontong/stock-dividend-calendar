、股息率评估</h4>\n<p>以当前股价约18元计算，2026年每股红利0.5元，对应税前股息率约为2.78%。横向对比：A股券商行业平均股息率约2.0%，广发证券处于行业中上水平；同期银行一年期理财收益率普遍在2.5%-3.0%区间，广发股息率与理财收益基本持平，但考虑到股息可享受持股满一年免税优惠，实际到手收益更具吸引力。纵向对比：广发证券自身历史股息率中枢约2.2%-3.0%，当前接近上沿，具备一定安全边际。</p>\n\n<h4>四、盈利能力与现金流</h4>\n<p>广发证券作为头部券商，2023-2025年净利润呈现稳健恢复态势，加权平均ROE从5.8%提升至7.5%左右。投行业务、财富管理和资产管理构成主要利润支柱，盈利质量良好。经营性现金流持续为净流入，现金流/净利润覆盖倍数长期保持在1.2倍以上，分红基础扎实。近几年现金分红总额占归属净利润比例维持在30%-40%，既保证了业务发展所需资金，又给予股东合理回报，平衡得当。</p>\n\n<h4>五、估值水平</h4>\n<p>当前广发证券A股市净率（PB）约1.15倍，处于近五年20%分位；市盈率（PE）约16.8倍，处于近五年15%分位。与头部券商（中信、华泰等）1.3-1.5倍PB相比，公司估值明显偏低。主要原因在于市场对券商资产质量及轻资本业务波动的折价，但其净资产回报率已趋稳，估值具备修复空间。综合考虑，当前估值处于“合理”偏低区间，有一定的安全边际。</p>\n\n<h4>六、成长性</h4>\n<p>中国经济转型下，资本市场直接融资比重逐步提升，券商财富管理转型、机构化趋势以及衍生品等创新业务为龙头券商带来增量空间。广发证券在投行、资管及研究领域居行业前列，并持续加码金融科技投入，长期成长基调为“稳健”。然而，行业高度依赖市场活跃度，短期业绩弹性与股市行情高度相关，成长性呈现周期性波动。预计未来三年营收和利润增速可维持在5%-10%的温和增长区间。</p>\n\n<h4>七、风险因素</h4>\n<p>① 市场系统性风险：股市持续低迷或交投萎缩将直接冲击经纪、两融及自营收入。② 政策风险：金融监管趋严、费率改革可能挤压利润空间。③ 资产质量风险：信用业务（股票质押、两融）的履约保障比例需持续关注，极端行情下可能产生减值。④ 竞争风险：行业集中度提升，外资券商开放加剧高端业务争夺。</p>\n\n<h4>八、综合投资建议</h4>\n<p>广发证券作为大中型综合性券商，具有稳定的分红能力和良好的股东回报传统。当前估值处于历史低位，股息率优于行业均值，具备较高安全边际。建议“稳健红利型”和“价值配置型”投资者予以关注，可将总仓位的5%-10%作为长期底仓配置。合理买入区间：17元以下股息率升至3%以上，性价比突显，可在16-18元区间分批布局。若股价快速拉升超过20元，估值进入偏高区域，宜逐步减仓。</p>", "highlights": ["连续多年实施现金分红，2024-2025年实现中期+末期两次分红，股东回报意愿强", "当前PB、PE均处于近五年历史低位，安全边际较高，估值修复弹性可期", "投行与财富管理业务位居行业前列，轻资本转型路径清晰，盈利稳定性逐步增强"], "risks": ["市场行情波动敏感性高，经纪及自营收入易受A股交投情绪拖累", "行业佣金率下行与竞争加剧，可能压缩传统通道业务利润空间"], "events": [{"ex_date": "2026-08-07", "cash": 5.0, "bonus": 0, "transfer": 0, "progress": "实施"}], "history": [{"ex_date": "2025-10-22", "cash": 1.0, "bonus": 0, "transfer": 0, "progress": "实施"}, {"ex_date": "2025-06-30", "cash": 4.0, "bonus": 0, "transfer": 0, "progress": "实施"}, {"ex_date": "2024-11-28", "cash": 1.0, "bonus": 0, "transfer": 0, "progress": "实施"}, {"ex_date": "2024-07-03", "cash": 3.0, "bonus": 0, "transfer": 0, "progress": "实施"}, {"ex_date": "2023-08-11", "cash": 3.5, "bonus": 0, "transfer": 0, "progress": "实施"}, {"ex_date": "2022-07-13", "cash": 5.0, " function barChart(id, getVal, unit, title) {
  const svg = document.getElementById(id);
  const valid = DATA.filter(d => getVal(d) > 0);
  if (!valid.length) { svg.parentElement.style.display='none'; return; }
  const max = Math.max(...valid.map(getVal)) * 1.15;
  const H = Math.max(valid.length * 44 + 30, 100);
  const W = 780, L = 140, R = 80, BW = W - L - R;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let html = '';
  // title
  html += `<text x="${L}" y="16" fill="#9ca3af" font-size="13" font-weight="600">${title}</text>`;
  // bars
  valid.forEach((d,i) => {
    const w = getVal(d) / max * BW;
    const y = 36 + i * 44;
    const c = COLORS[i % COLORS.length];
    html += `<text x="${L-8}" y="${y+18}" fill="#e4e6eb" font-size="13" text-anchor="end">${d.name}(${d.code})</text>`;
    html += `<rect x="${L}" y="${y}" width="${w}" height="24" rx="4" fill="${c}" opacity="0.85"/>`;
    html += `<text x="${L+w+6}" y="${y+17}" fill="#e4e6eb" font-size="12">${getVal(d)}${unit}</text>`;
  });
  svg.innerHTML = html;
}

    ${riskHtml ? `<h4> 风险提示</h4><ul>${riskHtml}</ul>` : ''}
    <h4> 详细分析</h4>
    <div class="analysis-text">${d.analysis||'无'}</div>
  </div>`;
});
document.getElementById('stock-cards').innerHTML = CARDS.join('');
</script>
</body>
</html>
